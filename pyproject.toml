[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tulkki"
version = "0.2.0"
description = "Finnish language understanding for voice assistants: morphology-aware tool calling, colloquial speech and ASR noise, with a benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shuceyb Nuradin Hussein" }]
keywords = ["finnish", "nlu", "voice-assistant", "morphology", "tool-calling", "llm", "benchmark"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
tulkki = "tulkki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
